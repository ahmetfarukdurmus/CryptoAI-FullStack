<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CryptoAI - Akıllı Kripto Portföy & Otopilot</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        background-color: #05070a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      #root {
        width: 100%;
        max-width: 430px;
        height: 100%;
        max-height: 932px;
        background-color: #090D14;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        border: 1px solid #1a2232;
      }
      #root > div {
        display: flex;
        flex: 1;
        width: 100%;
        height: 100%;
      }
      @media (max-width: 500px) {
        #root {
          max-width: 100%;
          max-height: 100%;
          border: none;
          box-shadow: none;
        }
      }
    </style>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('error-log');
        if (!el) {
          el = document.createElement('div');
          el.id = 'error-log';
          el.style = 'position:fixed;top:0;left:0;right:0;max-height:50vh;overflow:auto;background:rgba(220,38,38,0.95);color:white;padding:14px;font-family:monospace;font-size:11px;z-index:999999;white-space:pre-wrap;border-bottom:2px solid white;';
          document.body.appendChild(el);
        }
        var stack = error && error.stack ? '\n\nStack:\n' + error.stack : '';
        el.innerText = 'JS Error: ' + msg + '\nDosya: ' + (url || '').split('/').pop() + ' (Satır: ' + line + ')' + stack;
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
